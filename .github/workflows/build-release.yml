name: Build release zip

# Tag vX.Y.Z on the repo -> build the plugin zip and attach it to the GitHub Release. The plugin's
# built-in updater points at these Releases, so every vendor's WordPress offers the update. A pre-release
# tag (e.g. v0.2.0-beta1 marked "pre-release") serves the staging channel (SGY_CONNECT_BETA stores opt in).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # ⚠️ HOSTED, AND IT HAS TO BE. This said self-hosted because GitHub-hosted jobs failed across the
    # org while the Actions billing block was in place. That block was cleared on 2026-08-23, and the
    # self-hosted choice had meanwhile become a silent dead end: `sgy-connect-woo` is a PUBLIC repo,
    # and the org's Default runner group sets allows_public_repositories=false, so a
    # `runs-on: [self-hosted, staging]` job is never picked up by any runner. It simply queues until it
    # expires, which is what v0.6.1 did for half an hour with two idle, label-matching runners sitting
    # right there.
    #
    # ⚠️ DO NOT "FIX" THIS BY ALLOWING PUBLIC REPOSITORIES ON THE RUNNER GROUP. That setting is the
    # thing stopping anyone's fork pull request from executing arbitrary code on the staging EC2, which
    # runs the marketplace, the eco apps, nodesrv and the org's own CI runner. Building a public
    # release zip on a hosted runner is the normal arrangement and costs nothing here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VER=$(grep -oP "Version:\s*\K[0-9.]+" sgy-connect/sgy-connect.php | head -1)
          echo "tag=$TAG plugin header=$FILE_VER"
          if [ "${TAG%%-*}" != "$FILE_VER" ]; then
            echo "::error::Plugin header version ($FILE_VER) does not match tag ($TAG). Bump the header."
            exit 1
          fi

      - name: Lint PHP
        run: |
          find sgy-connect -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        # Zip WITH the top-level sgy-connect/ folder: WordPress installs a plugin into a directory named
        # after the zip's top entry, so the archive must contain sgy-connect/ (not its bare contents).
        #
        # TWO assets are attached on purpose:
        #   sgy-connect-vX.Y.Z.zip  archival, so an older build stays downloadable by version.
        #   sgy-connect.zip         a STABLE name, which is what makes
        #                           /releases/latest/download/sgy-connect.zip a permanent direct link.
        # The vendor panel's Download button points at that permanent URL, so it always serves the
        # newest release without anyone editing a link. A version-named asset alone cannot do that,
        # because the latest/download path has to know the exact file name.
        run: |
          zip -r "sgy-connect-${GITHUB_REF_NAME}.zip" sgy-connect -x '*.git*'
          cp "sgy-connect-${GITHUB_REF_NAME}.zip" sgy-connect.zip
          ls -la sgy-connect*.zip
          unzip -l "sgy-connect-${GITHUB_REF_NAME}.zip" | head -5

      - name: Attach zips to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sgy-connect-*.zip
            sgy-connect.zip
          generate_release_notes: true
